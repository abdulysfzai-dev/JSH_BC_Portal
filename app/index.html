<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSH Trade Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: soft pastel "wellness" canvas, glass cards, one raspberry→peach accent gradient, pastel stage colours */
  --ink:#1d1a2b; --ink-2:#5b5670; --ink-3:#8f8aa3;
  --bg:#fbf9ff; --card:rgba(255,255,255,.78); --line:#ece7f5;
  --accent:#e6407a; --accent-2:#ff9f6e; --violet:#7a5cff;
  --blush:#ffd3df; --peach:#ffe0c7; --lilac:#e3dbff; --mint:#c9f0de; --sky:#d3e8ff; --butter:#fff1b8;
  --s-sub:#f4a72b; --s-conf:#7a5cff; --s-ship:#2d9cdb; --s-inv:#e6407a; --s-paid:#1fae74;
  --display:"Sora", system-ui, sans-serif; --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px; --shadow:0 10px 30px -12px rgba(73,40,120,.18), 0 2px 6px rgba(73,40,120,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--violet) 55%,transparent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Backdrop blobs */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:float 18s ease-in-out infinite}
.b1{width:520px;height:520px;background:var(--blush);top:-160px;left:-120px}
.b2{width:460px;height:460px;background:var(--lilac);top:20%;right:-140px;animation-delay:-6s}
.b3{width:420px;height:420px;background:var(--peach);bottom:-160px;left:25%;animation-delay:-11s}
.b4{width:300px;height:300px;background:var(--mint);bottom:10%;right:20%;animation-delay:-3s;opacity:.55}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.06)}66%{transform:translate(-30px,25px) scale(.96)}}
#app{position:relative;z-index:1;min-height:100%}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:#fff;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:#fff0f2;color:#c2264f;box-shadow:none;border:1px solid #ffd0da}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;transition:border .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 15%,transparent)}
.input[readonly]{background:#f6f3fb;color:var(--ink-2)}
.prefill{position:relative}
.prefill .input{padding-right:74px;text-overflow:ellipsis}
.prefill::after{content:"from BC";position:absolute;right:10px;top:31px;font-size:10px;font-weight:700;color:var(--violet);background:var(--lilac);padding:2px 6px;border-radius:6px}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding:40px clamp(16px,5vw,80px)}
.login-hero h1{font-size:clamp(34px,5vw,58px);line-height:1.04;font-weight:800}
.grad-text{background:linear-gradient(110deg,var(--accent),var(--accent-2) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:200% center}}
.login-card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:34px;box-shadow:var(--shadow);max-width:440px;width:100%;justify-self:center;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
.login-card form{display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero-pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-weight:600;font-size:14px;animation:rise .7s both}
.dot{width:10px;height:10px;border-radius:50%}
.err{color:#c2264f;font-weight:600;font-size:14px;min-height:20px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px clamp(16px,3vw,36px);background:rgba(251,249,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;border:0;background:none;padding:0}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:conic-gradient(from 200deg,var(--accent),var(--accent-2),var(--violet),var(--accent));animation:spin 12s linear infinite}
.logo span{animation:spin 12s linear infinite reverse;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--butter);color:#7a5a00;letter-spacing:.04em;text-transform:uppercase}
.badge.env-demo{background:var(--butter);color:#7a5a00}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--violet),var(--accent))}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px clamp(16px,3vw,36px) 0}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--ink-2)}
.nav button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.main{padding:22px clamp(16px,3vw,36px) 60px;max-width:1360px;margin:0 auto}
.viewas{background:var(--ink);color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.viewas button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:4px 12px;font-weight:700}

.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:18px}
.anim>*{animation:rise .5s both}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}.anim>*:nth-child(5){animation-delay:.2s}.anim>*:nth-child(6){animation-delay:.25s}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:clamp(24px,3vw,32px);font-weight:800}
.crumb{border:0;background:none;color:var(--ink-2);font-weight:700;padding:0;margin-bottom:6px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px;color:var(--ink);background:linear-gradient(120deg,#ffe1ea,#ffe9d8 45%,#ebe4ff);box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(26px,3.4vw,40px);font-weight:800}
.hero .ring{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:30px solid rgba(255,255,255,.45);animation:float 14s ease-in-out infinite}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.hstat{background:rgba(255,255,255,.75);border-radius:16px;padding:14px}
.hstat b{display:block;font-family:var(--display);font-size:24px}
.hstat span{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.tile{position:relative;overflow:hidden;text-align:left;border:0;border-radius:22px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.tile:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 18px 40px -16px rgba(73,40,120,.35)}
.tile .ico{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.7);display:grid;place-items:center}
.tile .ico svg{width:22px;height:22px}
.tile h3{font-size:16px;font-weight:700;margin-top:12px}
.tile .count{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.tile .sub{font-size:12px;font-weight:600;color:var(--ink-2)}
.tile::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-40px;bottom:-40px;background:rgba(255,255,255,.35);transition:transform .4s}
.tile:hover::after{transform:scale(1.5)}
.t-create{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff}
.t-create .sub{color:rgba(255,255,255,.85)}
.t-conf{background:var(--lilac)} .t-ship{background:var(--sky)} .t-inv{background:var(--blush)} .t-paid{background:var(--mint)}

/* Pills & pipeline */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-submitted{background:#fff3dc;color:#a96800}
.st-confirmed{background:#ede8ff;color:#5638e0}
.st-shipped{background:#e0f1ff;color:#1774b0}
.st-invoiced{background:#ffe3ec;color:#c2264f}
.st-paid{background:#dcf7ea;color:#127a50}
.st-overdue{background:#c2264f;color:#fff}
.pipe{display:flex;align-items:center;gap:0;min-width:160px}
.pipe i{flex:1;height:6px;background:var(--line);border-radius:6px;margin-right:4px;position:relative;overflow:hidden}
.pipe i.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.pipe i.now::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:shimmer 1.6s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr.click:hover{background:rgba(255,255,255,.9);cursor:pointer}
tbody tr{animation:rise .4s both}
td.r,th.r{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:nowrap}
.link{border:0;background:none;padding:0;color:var(--violet);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--ink-2)}
.empty .big{font-size:40px;margin-bottom:6px}

/* Create order */
.co{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:18px;align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form-grid .span2{grid-column:span 2}.form-grid .span3{grid-column:1/-1}
.cat{position:sticky;top:84px;max-height:calc(100vh - 110px);display:flex;flex-direction:column}
.cat-list{overflow:auto;display:grid;gap:10px;padding:4px 2px 4px 0;margin-top:12px}
.prod{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;transition:transform .15s,border .15s}
.prod:hover{transform:translateX(3px);border-color:var(--blush)}
.prod .sw{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px}
.prod b{display:block;font-size:14px;line-height:1.25}
.prod small{color:var(--ink-3);font-size:12px}
.add{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center;transition:transform .2s}
.add:hover{transform:rotate(90deg) scale(1.08)}
.add.in{background:var(--s-paid)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff}
.qty button{width:30px;height:30px;border:0;background:none;font-weight:800;font-size:16px}
.qty input{width:52px;border:0;text-align:center;background:none;font-weight:700}
.qty input:focus{outline:none}
.totals{display:grid;gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-family:var(--display);font-size:22px;font-weight:800}
.order-no{font-family:var(--display);font-weight:800;font-size:15px;background:var(--ink);color:#fff;padding:6px 12px;border-radius:10px;letter-spacing:.03em}
.rule{display:flex;gap:10px;align-items:flex-start;background:#f3efff;border-radius:14px;padding:12px 14px;font-size:13px;color:#4a3aa8}
.rule svg{flex:none;width:18px;height:18px;margin-top:1px}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(29,26,43,.35);backdrop-filter:blur(3px);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:51;overflow:auto;box-shadow:-20px 0 60px rgba(29,26,43,.2);animation:slide .35s cubic-bezier(.2,.8,.2,1);padding:24px}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:#fff;border-radius:24px;z-index:52;padding:26px;box-shadow:0 30px 80px rgba(29,26,43,.3);animation:pop .3s cubic-bezier(.2,.8,.2,1.2)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}}
.x{border:0;background:#fff;width:36px;height:36px;border-radius:50%;box-shadow:var(--shadow);font-size:18px}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}
.tl{text-align:center;font-size:12px;font-weight:700;color:var(--ink-3)}
.tl .c{width:34px;height:34px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:#fff;transition:transform .3s}
.tl.done .c{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.tl.cur .c{animation:pulse 1.8s infinite}
.tl.done{color:var(--ink)}
.tl small{display:block;font-weight:600;color:var(--ink-3)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,64,122,.45)}70%{box-shadow:0 0 0 12px rgba(230,64,122,0)}100%{box-shadow:0 0 0 0 rgba(230,64,122,0)}}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kv div{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.kv span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.kv b{font-size:14px;word-break:break-word}
.lot{display:inline-flex;gap:6px;align-items:center;background:var(--sky);color:#14598a;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}

/* Posting animation */
.steps{display:grid;gap:10px;margin:16px 0}
.step{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--ink-3);transition:color .3s}
.step .b{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.step.run{color:var(--ink)} .step.run .b{border-color:var(--violet);border-top-color:transparent;animation:spin .8s linear infinite}
.step.ok{color:var(--ink)} .step.ok .b{background:var(--s-paid);border-color:var(--s-paid);color:#fff}
.success-check{width:84px;height:84px;margin:0 auto 10px;display:block}
.success-check circle{stroke:var(--s-paid);stroke-width:4;fill:none;stroke-dasharray:240;stroke-dashoffset:240;animation:draw .7s forwards}
.success-check path{stroke:var(--s-paid);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.link-pair{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.link-pair .order-no:last-child{background:var(--violet)}

/* Toast */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);animation:rise .3s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* Admin */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:800}
.kpi span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.sim{display:flex;gap:6px;flex-wrap:wrap}
.log{display:grid;gap:8px;max-height:420px;overflow:auto}
.log div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;padding:8px 10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;align-self:start}
.tag.get{background:var(--sky);color:#14598a}.tag.post{background:var(--blush);color:#a8204b}.tag.patch{background:var(--peach);color:#9a4a10}.tag.sim{background:var(--butter);color:#7a5a00}.tag.auth{background:var(--mint);color:#127a50}.tag.admin{background:var(--lilac);color:#4a3aa8}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{max-width:260px}
.switch{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2)}
.switch button.on{background:var(--ink);color:#fff}
.switch button[disabled]{opacity:.4;cursor:not-allowed}


@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.co{grid-template-columns:1fr}.cat{position:static;max-height:none}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:760px){.login{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:auto}.kv{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:repeat(5,minmax(52px,1fr));overflow-x:auto}.top .who .nm{display:none}}
@media (max-width:420px){.tiles{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function makeShipment(s, o, date) {
  const ym = new Date(date).toISOString().slice(2, 7).replace("-", "");
  const lines = [];
  o.lines.forEach((l, i) => {
    if (i === 0 && l.qty >= 24) { const a = Math.round(l.qty / 2); lines.push({ itemNo: l.itemNo, lotNo: `L${ym}-${1000 + rnd(9000)}`, qty: a }); lines.push({ itemNo: l.itemNo, lotNo: `L${ym}-${1000 + rnd(9000)}`, qty: l.qty - a }); }
    else lines.push({ itemNo: l.itemNo, lotNo: `L${ym}-${1000 + rnd(9000)}`, qty: l.qty });
  });
  return { qbtNo: "QBT-" + s.settings.next.qbt++, soNo: o.bc.soNo, date, lines };

function makeInvoice(s, o, date, terms) {
  const t = totals(o.lines); const days = parseInt(terms) || 30;
  return { no: "PSI-" + s.settings.next.inv++, soNo: o.bc.soNo, portalNo: o.portalNo, date, dueDate: addDays(date, days), amount: t.total, remaining: t.total, paidAt: "" };
}
function totals(lines) { const sub = lines.reduce((a, l) => a + l.qty * l.unitPrice, 0); const gst = +(sub * GST).toFixed(2); return { sub: +sub.toFixed(2), gst, total: +(sub + gst).toFixed(2), units: lines.reduce((a, l) => a + Number(l.qty), 0) }; }

/* ============ stage logic (mirrors BC rules) ============ */
// Confirmed = Status "Released" AND Order Reviewed = "Reviewed". Shipped = a QBT record exists for the SO. Paid = invoice remaining = 0.
function stage(o) {
  if (!o.bc.soNo) return "draft";
  if (o.invoice && o.invoice.remaining <= 0) return "paid";
  if (o.invoice) return "invoiced";
  if (o.shipments && o.shipments.length) return "shipped";
  // Confirmed = Released AND Order Reviewed = Reviewed. If BC hasn't told us Order Reviewed (connector not installed), Released alone counts.
  if (o.bc.status === "Released" && (o.bc.reviewed === "Reviewed" || (Live.on && o.bc.reviewed === null))) return "confirmed";
  return "submitted";
}
const STAGE_LABEL = { submitted: "Awaiting confirmation", confirmed: "Confirmed", shipped: "Shipped", invoiced: "To be paid", paid: "Paid", draft: "Draft" };
const STAGES = ["submitted", "confirmed", "shipped", "invoiced", "paid"];
const isOverdue = o => o.invoice && o.invoice.remaining > 0 && new Date(o.invoice.dueDate) < new Date();
const editable = o => !Live.on && o.bc.soNo && o.bc.status === "Open" && !o.shipments.length && !o.invoice;
function pill(o) { const st = stage(o); if (st === "invoiced" && isOverdue(o)) return `<span class="pill st-overdue">Overdue</span>`; return `<span class="pill st-${st}">${STAGE_LABEL[st]}</span>`; }
function pipe(o) { const i = STAGES.indexOf(stage(o)); return `<div class="pipe" aria-label="${STAGE_LABEL[stage(o)]}">${STAGES.map((_, k) => `<i class="${k <= i ? "on" : ""} ${k === i && i < 4 ? "now" : ""}"></i>`).join("")}</div>`; }

/* ============ store: artifact db → localStorage → memory ============ */
const LS_KEY = "jsh-portal-state-v1";
const Store = {
  state: null, db: null, ref: null, mode: "memory", lastJSON: "", writing: false, dirty: false,
  async init() {
    let db = null;
    try { if (window.claude && claude.use) db = await Promise.race([claude.use("db"), new Promise(r => setTimeout(() => r(null), 6000))]); } catch (e) { db = null; }
    if (db) {
      this.db = db; this.ref = db.doc("portal/state");
      try {
        const snap = await Promise.race([this.ref.get(), new Promise((_, j) => setTimeout(() => j(new Error("timeout")), 10000))]);
        if (snap.exists) { this.state = clone(snap.data().s); }
        this.mode = "cloud";
        this.ref.onSnapshot(sn => {
          if (!sn.exists || sn.metadata.hasPendingWrites) return;
          const j = JSON.stringify(sn.data().s); if (j === this.lastJSON) return;
          this.lastJSON = j; this.state = JSON.parse(j); onRemoteChange();
        }, () => {});
      } catch (e) { this.db = null; this.ref = null; }
    }
    if (!this.state && this.mode !== "cloud") { try { const raw = localStorage.getItem(LS_KEY); if (raw) { this.state = JSON.parse(raw); this.mode = "local"; } } catch (e) {} }
    if (!this.state) { this.state = demoState(); await this.save(); }
    if (this.mode === "memory") { try { localStorage.setItem(LS_KEY + "-t", "1"); localStorage.removeItem(LS_KEY + "-t"); this.mode = "local"; this.save(); } catch (e) {} }
  },
  async save() {
    const j = JSON.stringify(this.state); this.lastJSON = j;
    if (this.ref) {
      if (this.writing) { this.dirty = true; return; }
      this.writing = true;
      try { await this.ref.set({ s: JSON.parse(j) }); }
      catch (e) { if (e && e.code === "quota_exceeded") toast("Storage is full. Clear old orders in Settings."); else if (e && e.code === "invalid_argument") toast("You have view-only access, so changes are not saved."); }
      this.writing = false;
      if (this.dirty) { this.dirty = false; return this.save(); }
      return;
    }
    try { localStorage.setItem(LS_KEY, j); } catch (e) {}
  }
};
function log(type, text) { const S = Store.state; S.log.unshift({ ts: iso(Date.now()), actor: me() ? me().name : "System", type, text }); S.log = S.log.slice(0, 200); }


/* ============ LIVE MODE: Business Central sandbox through /api ============ */

const Live = {

    try { const r = await Promise.race([fetch("/api/ping", { cache: "no-store" }), new Promise((_, j) => setTimeout(() => j(new Error("t")), 20000))]); if (!r.ok) return false; const h = await r.json(); this.on = !!(h && h.live); } catch (e) { this.on = false; }

  async api(method, path, body) {
    const r = await fetch("/api" + path, { method, headers: { "Content-Type": "application/json", "x-portal-token": this.token }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });

function afterRender() {
  document.querySelectorAll("[data-count]").forEach(el => countUp(el, Number(el.dataset.count), el.dataset.fmt));

}
function countUp(el, to, fmt) {
  const f = v => fmt === "money" ? money(v) : Math.round(v).toLocaleString("en-AU");
  if (reduced || !to) { el.textContent = f(to); return; }
  const t0 = performance.now(), d = 700;
  const step = t => { const p = Math.min(1, (t - t0) / d); el.textContent = f(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

}
function refreshLines() { $("#lines").innerHTML = linesTable(); const c = customer(draft.customerNo); $("#catList").innerHTML = catList(BC.getPriceList(c.priceGroup)); $("#submitBtn").disabled = !draft.lines.length; (Live.on || Store.state.log.shift()); }
function bindCreate() {
  document.querySelectorAll("[data-h]").forEach(el => el.addEventListener("input", () => { draft.header[el.dataset.h] = el.value; }));
  const cs = $("#catSearch"); cs && cs.addEventListener("input", () => { ui.catSearch = cs.value; const c = customer(draft.customerNo); $("#catList").innerHTML = catList(BC.getPriceList(c.priceGroup)); (Live.on || Store.state.log.shift()); });
  $("#lines").addEventListener("change", e => { const it = e.target.dataset.qi; if (!it) return; const l = draft.lines.find(x => x.itemNo === it); let v = parseInt(e.target.value, 10); if (!(v > 0)) v = 1; l.qty = Math.min(v, 9999); refreshLines(); });
}
function addLine(itemNo) {
  const c = customer(draft.customerNo); const p = BC.getPriceList(c.priceGroup).find(x => x.itemNo === itemNo); (Live.on || Store.state.log.shift());

  if (ex) ex.qty += p.minQty; else draft.lines.push({ lineNo: (draft.lines.length + 1) * 10000, itemNo, desc: p.item.desc, uom: p.item.uom, qty: p.minQty, unitPrice: p.unitPrice });
  refreshLines(); toast(`Added ${p.item.desc}`);
}
async function submitOrder() {
  const c = customer(draft.customerNo);
  const pl = BC.getPriceList(c.priceGroup);
  // Re-validate every line against the live price list before posting
  const bad = draft.lines.filter(l => !pl.find(p => p.itemNo === l.itemNo));
  if (bad.length) { toast(`Remove ${bad.map(b => b.itemNo).join(", ")}: no longer on your price list.`); return; }
  if (!draft.lines.length) { toast("Add at least one item."); return; }
  draft.lines.forEach(l => { l.unitPrice = pl.find(p => p.itemNo === l.itemNo).unitPrice; });
  const editing = draft._editing;
  openModal(`<h2 style="font-size:22px">${editing ? "Saving changes" : "Sending to Business Central"}</h2><p class="muted" style="margin:6px 0 0">${esc(draft.portalNo)}</p>
    <div class="steps"><div class="step" id="s1"><span class="b"></span>Checking items against price list ${esc(c.priceGroup)}</div><div class="step" id="s2"><span class="b"></span>${editing ? "Updating sales order lines" : "Creating sales order header"}</div><div class="step" id="s3"><span class="b"></span>${editing ? "Confirming status is still Open" : `Adding ${draft.lines.length} line${draft.lines.length > 1 ? "s" : ""}`}</div><div class="step" id="s4"><span class="b"></span>Linking portal order to BC order</div></div>`, true);
  const run = async (id, ms) => { const el = $("#" + id); el.className = "step run"; await wait(ms); el.className = "step ok"; el.querySelector(".b").innerHTML = "✓"; };
  await run("s1", 450);
  if (editing) {
    const live = Store.state.orders.find(o => o.portalNo === draft.portalNo);
    if (!live || !editable(live)) { closeModal(); toast("This order has been released in BC and can no longer be edited."); draft = null; go("confirmed"); return; }
    await run("s2", 300); await BC.patchSalesOrder(draft); await run("s3", 250);
    live.lines = clone(draft.lines); live.header = clone(draft.header); await run("s4", 200);
    log("admin", `${me().name} edited ${live.portalNo} / ${live.bc.soNo}`);
  } else {
    await run("s2", 300);
    let res;
    try { res = await BC.postSalesOrder(draft); }
    catch (e) { openModal(`<h2 style="font-size:22px">Order not created</h2><p class="muted" style="margin:8px 0 0">${esc(e.message)}</p><p class="faint" style="font-size:13px">Nothing was created in Business Central. Your order is still here: fix the issue and submit again.</p><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" data-act="close-layer">Back to my order</button></div>`); return; }
    await run("s3", 300);
    if (res.portalNo) draft.portalNo = res.portalNo;
    const o = clone(draft); delete o._editing; o.createdAt = iso(Date.now()); o.createdBy = me().name;
    o.bc = { soNo: res.number, status: res.status, reviewed: res.orderReviewed, submittedAt: iso(Date.now()), releasedAt: "", reviewedAt: "" };
    Store.state.orders.push(o); draft.bc.soNo = res.number;
    await run("s4", 250);
  }
  await Store.save();
  const saved = draft; draft = null;
  openModal(`<div style="text-align:center"><svg class="success-check" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38"/><path d="M26 43l11 11 21-23"/></svg>
    <h2 style="font-size:24px">${editing ? "Changes saved" : "Order submitted"}</h2>
    <p class="muted" style="margin:6px 0 0">${editing ? "Your sales order in Business Central has been updated." : "Your order is in Business Central and waiting for JSH to confirm it."}</p>
    <div class="link-pair"><span class="order-no">${esc(saved.portalNo)}</span><span aria-hidden="true">⇄</span><span class="order-no">${esc(saved.bc.soNo)}</span></div>
    <div class="faint" style="font-size:13px">Portal order no. ⇄ BC sales order no.</div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap"><button class="btn ghost" data-act="close-go" data-to="confirmed">View my orders</button><button class="btn primary" data-act="close-new">Create another</button></div></div>`);
  if (!editing) confetti();
  if (Live.on) BC.refresh();
}

function simPanel(o) {
  if (Store.state.settings.env !== "demo") return "";
  const st = stage(o);
  return `<section class="card" style="margin-top:20px;background:#fffbea"><h3 style="font-size:15px">BC sandbox simulator</h3><p class="faint" style="font-size:13px;margin:4px 0 10px">Stands in for what JSH staff do in Business Central, so you can test every stage. Demo only. In production these steps happen in BC and the portal reads them.</p>

function simulate(act, portalNo) {
  const S = Store.state, o = S.orders.find(x => x.portalNo === portalNo); if (!o) return;
  const c = customer(o.customerNo);
  if (act === "release") { o.bc.status = "Released"; o.bc.releasedAt = iso(Date.now()); }
  if (act === "reopen") { o.bc.status = "Open"; o.bc.reviewed = ""; }
  if (act === "review") { o.bc.reviewed = "Reviewed"; o.bc.reviewedAt = iso(Date.now()); }
  if (act === "ship") o.shipments.push(makeShipment(S, o, iso(Date.now())));
  if (act === "invoice") o.invoice = makeInvoice(S, o, iso(Date.now()), c.terms);
  if (act === "pay") { o.invoice.remaining = 0; o.invoice.paidAt = iso(Date.now()); }
  log("sim", `Simulator: ${act} on ${o.bc.soNo} (${o.portalNo})`);
  Store.save(); openOrder(portalNo); render(); toast(`${o.bc.soNo}: ${STAGE_LABEL[stage(o)]}`);
}

/* ============ modals, toasts, confetti ============ */
function openModal(html, locked) { $("#layer").innerHTML = `<div class="scrim" ${locked ? "" : 'data-act="close-layer"'}></div><div class="modal" role="dialog" aria-modal="true">${html}</div>`; }
function closeModal() { $("#layer").innerHTML = ""; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 2600); }
function confetti() {
  if (reduced) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#e6407a", "#ff9f6e", "#7a5cff", "#1fae74", "#2d9cdb", "#ffd166"];
  const ps = Array.from({ length: 160 }, () => ({ x: innerWidth / 2, y: innerHeight / 2.4, vx: (Math.random() - .5) * 16, vy: Math.random() * -14 - 4, r: Math.random() * 6 + 4, c: cols[rnd(cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let f = 0; const tick = () => { ctx.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }); if (++f < 150) requestAnimationFrame(tick); else ctx.clearRect(0, 0, cv.width, cv.height); };
  tick();
}
async function openInvoicePdf(portalNo, btn) {
  const o = Store.state.orders.find(x => x.portalNo === portalNo); if (!o || !o.invoice) return;
  if (!Live.on || !o.invoice.id) { toast("Invoice PDFs come from Business Central. Not available on demo data."); return; }
  const win = window.open("", "_blank"); // open first, inside the click, so pop-up blockers allow it
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Loading…";
  try {
    const r = await fetch(`/api/invoices/${o.invoice.id}/pdf`, { headers: { "x-portal-token": Live.token } });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || "Couldn't get the invoice from Business Central."); }
    const url = URL.createObjectURL(await r.blob());
    if (win) win.location.href = url; else { const a = document.createElement("a"); a.href = url; a.download = `Invoice-${o.invoice.no}.pdf`; a.click(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { if (win) win.close(); toast(e.message); }
  btn.disabled = false; btn.textContent = label;
}

    <p class="muted" style="margin:8px 0 0">${kind === "all" ? "Users, customers, items, price lists and orders go back to the demo set. Passwords return to the prototype defaults." : "Every portal order, shipment and invoice record is removed. Customers, items, price lists and users stay."} This only affects portal data. Nothing changes in Business Central.</p>
    <div class="field" style="margin-top:14px"><label for="rc">Type RESET to confirm</label><input class="input" id="rc" autocomplete="off"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-act="close-layer">Cancel</button><button class="btn danger" id="rgo" disabled>${kind === "all" ? "Reset to demo" : "Clear orders"}</button></div>`);
  $("#rc").addEventListener("input", e => { $("#rgo").disabled = e.target.value !== "RESET"; });
  $("#rgo").addEventListener("click", async () => {
    const S = Store.state;
    if (kind === "all") { const keep = session.userId; Store.state = demoState(); if (!Store.state.users.find(u => u.id === keep)) session.userId = "u-admin"; }
    else { S.orders = []; log("admin", "All portal orders cleared (number series kept so portal nos. stay unique)"); }
    draft = null; await Store.save(); closeModal(); render(); toast(kind === "all" ? "Demo data restored" : "Orders cleared. Fresh start.");
  });
}

/* ============ events ============ */
document.addEventListener("click", e => {
  const t = e.target.closest("button, tr[data-open], [data-act]"); if (!t) return;
  const d = t.dataset; const S = Store.state;
  if (d.go) { if (d.go === "create") { startDraft(); return; } closeModal(); go(d.go); return; }
  if (d.open) { openOrder(d.open); return; }
  if (d.add) { addLine(d.add); return; }
  if (d.rm) { draft.lines = draft.lines.filter(l => l.itemNo !== d.rm); refreshLines(); return; }
  if (d.q) { const [it, dlt] = d.q.split("|"); const l = draft.lines.find(x => x.itemNo === it); const step = Number(dlt); l.qty = Math.max(1, l.qty + step); refreshLines(); return; }
  if (d.cat) { ui.catCat = d.cat; document.querySelectorAll("[data-cat]").forEach(b => b.classList.toggle("on", b.dataset.cat === d.cat)); $("#catList").innerHTML = catList(BC.getPriceList(customer(draft.customerNo).priceGroup)); (Live.on || S.log.shift()); return; }
  if (d.conf) { ui.confFilter = d.conf; render(); return; }
  if (d.af) { ui.adminFilter = d.af; render(); return; }
  if (d.ig) { ui.itemGroup = d.ig; render(); return; }
  if (d.pay) { payModal(d.pay); return; }
  if (d.pdf) { openInvoicePdf(d.pdf, t); return; }
  if (d.reinvite) { const u = (liveUsers || []).find(x => x.email === d.reinvite); inviteModal(u); return; }
  if (d.ustatus) { const [em, st] = d.ustatus.split("|"); t.disabled = true; Live.api("POST", "/users/status", { email: em, status: st }).then(() => { liveUsers = null; render(); toast(st === "disabled" ? "Access switched off" : "Access switched back on"); }).catch(e => { t.disabled = false; toast(e.message); }); return; }
  if (d.edit) { const o = S.orders.find(x => x.portalNo === d.edit); closeModal(); if (o && editable(o)) startDraft(o); else toast("This order is locked."); return; }
  if (d.sim) { const [a, p] = d.sim.split("|"); simulate(a, p); return; }
  if (d.savepg) { const no = d.savepg; const v = ($("#pg-" + CSS.escape(no)) || {}).value || ""; t.disabled = true; Live.api("POST", "/customers/pricegroup", { customerNo: no, priceGroup: v }).then(r => { t.disabled = false; const c = S.customers.find(x => x.no === no); if (c) c.priceGroup = r.priceGroup; toast(r.priceGroup ? `${no}: price group ${r.priceGroup}, ${r.items} items` : `${no}: price group cleared`); }).catch(e => { t.disabled = false; toast(e.message); }); return; }
  if (d.viewas) { session.viewAs = d.viewas; saveSession(); if (Live.on) { route = { page: "home", sub: "" }; liveSignedIn(); } else go("home"); return; }
  if (d.cact) { const c = customer(d.cact); c.active = !c.active; log("admin", `Portal access ${c.active ? "enabled" : "disabled"} for ${c.no}`); Store.save(); render(); return; }
  if (d.iblock) { const it = S.items.find(x => x.no === d.iblock); it.blocked = !it.blocked; log("admin", `${it.no} ${it.blocked ? "hidden" : "shown"} in portal`); Store.save(); render(); return; }
  if (d.utog) { const u = S.users.find(x => x.id === d.utog); u.active = !u.active; log("admin", `User ${u.username} ${u.active ? "enabled" : "disabled"}`); Store.save(); render(); return; }
  if (d.ureset) { const u = S.users.find(x => x.id === d.ureset); u.password = genPw(); log("admin", `Password reset for ${u.username}`); Store.save(); openModal(`<h2 style="font-size:22px">Password reset</h2><div class="kv" style="grid-template-columns:1fr 1fr;margin-top:12px"><div><span>Username</span><b class="mono">${esc(u.username)}</b></div><div><span>New password</span><b class="mono">${esc(u.password)}</b></div></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" data-act="close-layer">Done</button></div>`); return; }
  switch (d.act) {
    case "logout": if (me()) log("auth", `${me().name} signed out`); Store.save(); Live.token = ""; session = null; saveSession(); draft = null; closeModal(); render(); break;
    case "exit-viewas": session.viewAs = ""; saveSession(); draft = null; if (Live.on) { route = { page: "admin-overview", sub: "" }; liveSignedIn(); } else go("admin-overview"); break;
    case "close-layer": closeModal(); break;
    case "close-go": closeModal(); go(d.to); break;
    case "close-new": closeModal(); startDraft(); break;
    case "cancel-draft": draft = null; go(route.sub || "home"); break;
    case "submit-order": submitOrder(); break;
    case "sync": { const b = t; b.disabled = true; b.querySelector("svg").animate([{ transform: "rotate(0)" }, { transform: "rotate(360deg)" }], { duration: 700, iterations: 2 }); Promise.resolve(BC.refresh(activeCustomerNo())).then(() => { Store.save(); setTimeout(() => { render(); toast("Status refreshed from Business Central"); }, reduced ? 0 : 900); }); break; }
    case "add-user": userModal(); break;
    case "invite-user": inviteModal(); break;
    case "cust-search": { const q = ($("#custQ") || {}).value || ""; ui.custQ = q; if (!q.trim()) { ui.custResults = null; render(); break; } Live.api("GET", "/customers?q=" + encodeURIComponent(q.trim())).then(r => { ui.custResults = r.value.map(c => ({ no: c.number, name: c.displayName, email: c.email || "", priceGroup: c.priceGroup || "" })); render(); }).catch(e => toast(e.message)); break; }
    case "cust-clear": ui.custQ = ""; ui.custResults = null; render(); break;
    case "forgot": forgotModal(); break;
    case "copy-link": { const el = $("#ivlink"); el.select(); navigator.clipboard.writeText(el.value).then(() => toast("Link copied")).catch(() => toast("Select the link and copy it")); break; }
    case "reset-orders": resetModal("orders"); break;
    case "reset-all": resetModal("all"); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "admSearch") { ui.search = e.target.value; clearTimeout(window.__s); window.__s = setTimeout(() => { render(); const el = $("#admSearch"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); } });
document.addEventListener("change", e => { if (e.target.id === "viewAsSel" && e.target.value) { session.viewAs = e.target.value; saveSession(); if (Live.on) { route = { page: "home", sub: "" }; liveSignedIn(); } else go("home"); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "custQ") { e.preventDefault(); const b = document.querySelector('[data-act="cust-search"]'); if (b) b.click(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layer").innerHTML && !$(".steps")) closeModal(); });


/* ============ boot ============ */
(async () => {
  const slow = setTimeout(() => { if (!me()) $("#app").innerHTML = `<div style="display:grid;place-items:center;min-height:100vh;text-align:center"><div><div class="logo" style="width:64px;height:64px;font-size:18px;margin:0 auto 14px"><span>JSH</span></div><div class="muted" style="font-weight:700">Waking up the portal…</div><div class="faint" style="font-size:13px;margin-top:4px">First visit in a while takes a few seconds.</div></div></div>`; }, 2500);
  const on = await Live.detect(); clearTimeout(slow);
  if (on) {
    Store.state = demoState(); Store.state.orders = []; Store.state.log = []; Store.mode = "live"; Store.save = async () => {};
    if (await Live.resume()) { const h = location.hash.slice(1); route.page = h && h !== "create" ? h : (Live.user.role === "admin" ? "admin-overview" : "home"); await liveSignedIn(); return; }
    session = null; saveSession(); render(); return;
  }
  await Store.init(); const h = location.hash.slice(1); if (h && me()) route.page = h === "create" ? "home" : h; render();
})();
})();
</script>
</body>
</html>
